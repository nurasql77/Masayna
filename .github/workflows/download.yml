name: Download and Sign Masyaanya APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/download.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. APK-ны Google Drive-дан жүктеу
      # ============================================================
      - name: Download APK
        shell: bash
        run: |
          set -euo pipefail

          echo "gdown орнатылуда..."

          python3 -m pip install \
            --quiet \
            --disable-pip-version-check \
            "gdown==5.2.0"

          rm -f Masyaanya.apk

          echo "Google Drive-дан APK жүктелуде..."

          SUCCESS=0

          for i in 1 2 3; do
            echo ""
            echo "Жүктеу әрекеті: $i/3"

            if python3 -m gdown \
              "https://drive.google.com/uc?id=1Q3SwSjayWB-OZENGGdxKnPakxpKJLh52" \
              -O Masyaanya.apk; then

              if [ -s Masyaanya.apk ]; then
                SUCCESS=1
                break
              fi
            fi

            echo "Жүктеу сәтсіз."
            rm -f Masyaanya.apk

            if [ "$i" -lt 3 ]; then
              echo "10 секунд күтеміз..."
              sleep 10
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "::error::Google Drive-дан APK жүктелмеді."
            echo ""
            echo "Google Drive файлы үшін:"
            echo "Share → General access → Anyone with the link → Viewer"
            echo ""
            exit 1
          fi

          echo ""
          echo "Жүктелген файл:"
          ls -lh Masyaanya.apk

          echo ""
          echo "Файл түрі:"
          file Masyaanya.apk

          # APK — ZIP контейнері.
          # Сондықтан unzip арқылы тексереміз.
          if ! unzip -t Masyaanya.apk >/dev/null 2>&1; then
            echo ""
            echo "::error::Жүктелген файл жарамды APK емес!"
            echo ""
            echo "Файлдың алғашқы 32 байты:"
            xxd -l 32 Masyaanya.apk || true
            exit 1
          fi

          echo ""
          echo "APK дұрыс жүктелді."

      # ============================================================
      # 2. Java орнату
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. Android SDK орнату
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 4. Android Build Tools
      # ============================================================
      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses >/dev/null 2>&1 || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;34.0.0"

          echo ""
          echo "Build Tools орнатылды."

          ls -la "$ANDROID_HOME/build-tools/34.0.0/"

      # ============================================================
      # 5. APK-ны қолтаңбалау
      # ============================================================
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          # ----------------------------------------------------------
          # Secret тексеру
          # ----------------------------------------------------------

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret жоқ!"
            echo "Settings → Secrets and variables → Actions"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret жоқ!"
            exit 1
          fi

          echo "Secret-тер табылды."

          # ----------------------------------------------------------
          # P12 файлды қалпына келтіру
          # ----------------------------------------------------------

          echo "$KEYSTORE_BASE64" | base64 --decode > release.p12

          if [ ! -s release.p12 ]; then
            echo "::error::release.p12 бос!"
            echo "::error::KEYSTORE_BASE64 дұрыс емес."
            exit 1
          fi

          echo "P12 файл қалпына келтірілді."

          # ----------------------------------------------------------
          # P12 паролін тексеру
          # ----------------------------------------------------------

          if ! keytool -list \
            -keystore release.p12 \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null 2>&1; then

            echo "::error::KEYSTORE_PASSWORD дұрыс емес немесе P12 зақымдалған!"
            exit 1
          fi

          echo "P12 паролі дұрыс."

          # ----------------------------------------------------------
          # Alias табу
          # ----------------------------------------------------------

          ALIAS=$(
            keytool -list -v \
              -keystore release.p12 \
              -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" |
            sed -n 's/^Alias name: //p' |
            head -n 1
          )

          if [ -z "$ALIAS" ]; then
            echo "::error::P12 ішінен alias табылмады!"
            exit 1
          fi

          echo "Alias табылды: $ALIAS"

          # ----------------------------------------------------------
          # Build Tools жолы
          # ----------------------------------------------------------

          BT_DIR="$ANDROID_HOME/build-tools/34.0.0"

          if [ ! -x "$BT_DIR/zipalign" ]; then
            echo "::error::zipalign табылмады!"
            exit 1
          fi

          if [ ! -x "$BT_DIR/apksigner" ]; then
            echo "::error::apksigner табылмады!"
            exit 1
          fi

          echo "Build Tools: $BT_DIR"

          # ----------------------------------------------------------
          # APK zipalign
          # ----------------------------------------------------------

          echo ""
          echo "APK zipalign жасалуда..."

          "$BT_DIR/zipalign" \
            -f \
            -p \
            4 \
            Masyaanya.apk \
            Masyaanya-aligned.apk

          if [ ! -s Masyaanya-aligned.apk ]; then
            echo "::error::zipalign нәтижесінде APK жасалмады!"
            exit 1
          fi

          echo "zipalign дайын."

          # ----------------------------------------------------------
          # APK signing
          # ----------------------------------------------------------

          echo ""
          echo "APK қолтаңбалануда..."

          "$BT_DIR/apksigner" sign \
            --ks release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Masyaanya-signed.apk \
            Masyaanya-aligned.apk

          if [ ! -s Masyaanya-signed.apk ]; then
            echo "::error::Қолтаңбаланған APK жасалмады!"
            exit 1
          fi

          echo ""
          echo "APK қолтаңбаланды."

          # ----------------------------------------------------------
          # Signature тексеру
          # ----------------------------------------------------------

          echo ""
          echo "Қолтаңба тексерілуде..."

          "$BT_DIR/apksigner" verify \
            --verbose \
            --print-certs \
            Masyaanya-signed.apk

          echo ""
          echo "Қолтаңба дұрыс."

          # ----------------------------------------------------------
          # Уақытша файлдарды өшіру
          # ----------------------------------------------------------

          rm -f release.p12
          rm -f Masyaanya-aligned.apk

          echo ""
          echo "Уақытша файлдар өшірілді."

          echo ""
          echo "Дайын APK:"
          ls -lh Masyaanya-signed.apk

      # ============================================================
      # 6. Дайын APK-ны Artifact ретінде сақтау
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Masyaanya-signed
          path: Masyaanya-signed.apk
          if-no-files-found: error
          retention-days: 30