name: Build Masyaanya Shizuku Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        shell: bash
        run: |
          set -e

          test -n "$KEYSTORE_BASE64" || {
            echo "::error::KEYSTORE_BASE64 is missing"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "::error::KEYSTORE_PASSWORD is missing"
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install gdown
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown==5.2.0

      - name: Download Masyaanya
        run: |
          python3 -m gdown \
            "1Q3SwSjayWB-OZENGGdxKnPakxpKJLh52" \
            -O Masyaanya.apk

          test -s Masyaanya.apk
          unzip -t Masyaanya.apk >/dev/null

          echo "Downloaded:"
          ls -lh Masyaanya.apk

      - name: Restore keystore
        shell: bash
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"

          chmod 600 "$RUNNER_TEMP/release.p12"

          keytool \
            -list \
            -keystore "$RUNNER_TEMP/release.p12" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1)"

          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;34.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf installer

          mkdir -p installer/app/src/main/java/com/nurasql77/masyaanya
          mkdir -p installer/app/src/main/res/layout
          mkdir -p installer/app/src/main/res/values
          mkdir -p installer/app/src/main/assets

          cp Masyaanya.apk \
            installer/app/src/main/assets/Masyaanya.apk

          printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            '' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '}' \
            '' \
            'rootProject.name = "MasyaanyaInstaller"' \
            'include(":app")' \
            > installer/settings.gradle

          printf '%s\n' \
            'import org.gradle.api.initialization.resolve.RepositoriesMode' \
            '' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            '' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '}' \
            '' \
            'rootProject.name = "MasyaanyaInstaller"' \
            'include(":app")' \
            > installer/settings.gradle

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application" version "8.7.3" apply false' \
            '}' \
            > installer/build.gradle

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'android.nonTransitiveRClass=false' \
            > installer/gradle.properties

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application"' \
            '}' \
            '' \
            'android {' \
            '    namespace "com.nurasql77.masyaanya"' \
            '    compileSdk 35' \
            '' \
            '    defaultConfig {' \
            '        applicationId "com.nurasql77.masyaanya.installer"' \
            '        minSdk 24' \
            '        targetSdk 35' \
            '        versionCode 1' \
            '        versionName "1.0"' \
            '    }' \
            '' \
            '    buildTypes {' \
            '        release {' \
            '            minifyEnabled false' \
            '            shrinkResources false' \
            '        }' \
            '    }' \
            '' \
            '    compileOptions {' \
            '        sourceCompatibility JavaVersion.VERSION_17' \
            '        targetCompatibility JavaVersion.VERSION_17' \
            '    }' \
            '}' \
            '' \
            'dependencies {' \
            '    implementation "dev.rikka.shizuku:api:13.1.5"' \
            '    implementation "dev.rikka.shizuku:provider:13.1.5"' \
            '}' \
            > installer/app/build.gradle

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <application' \
            '        android:allowBackup="false"' \
            '        android:label="Masyaanya Installer"' \
            '        android:theme="@style/AppTheme">' \
            '        <activity' \
            '            android:name=".MainActivity"' \
            '            android:exported="true">' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.LAUNCHER" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '    </application>' \
            '</manifest>' \
            > installer/app/src/main/AndroidManifest.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">' \
            '        <item name="android:fontFamily">sans</item>' \
            '    </style>' \
            '</resources>' \
            > installer/app/src/main/res/values/styles.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <string name="app_name">Masyaanya Installer</string>' \
            '</resources>' \
            > installer/app/src/main/res/values/strings.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:layout_width="match_parent"' \
            '    android:layout_height="match_parent"' \
            '    android:orientation="vertical"' \
            '    android:gravity="center"' \
            '    android:padding="24dp">' \
            '' \
            '    <TextView' \
            '        android:id="@+id/status"' \
            '        android:layout_width="match_parent"' \
            '        android:layout_height="wrap_content"' \
            '        android:text="Masyaanya Installer"' \
            '        android:textSize="20sp"' \
            '        android:gravity="center"' \
            '        android:padding="16dp" />' \
            '' \
            '    <Button' \
            '        android:id="@+id/installButton"' \
            '        android:layout_width="match_parent"' \
            '        android:layout_height="wrap_content"' \
            '        android:text="Install Masyaanya"' \
            '        android:layout_marginTop="20dp" />' \
            '</LinearLayout>' \
            > installer/app/src/main/res/layout/activity_main.xml

          printf '%s\n' \
            'package com.nurasql77.masyaanya;' \
            '' \
            'import android.app.Activity;' \
            'import android.os.Bundle;' \
            'import android.content.pm.PackageManager;' \
            'import android.widget.Button;' \
            'import android.widget.TextView;' \
            'import java.io.*;' \
            'import rikka.shizuku.Shizuku;' \
            '' \
            'public class MainActivity extends Activity {' \
            '' \
            '    private static final int REQUEST_CODE = 100;' \
            '    private TextView status;' \
            '    private Button installButton;' \
            '' \
            '    private final Shizuku.OnRequestPermissionResultListener listener =' \
            '        (requestCode, grantResult) -> {' \
            '' \
            '        if (requestCode != REQUEST_CODE) return;' \
            '' \
            '        runOnUiThread(() -> {' \
            '            if (grantResult == PackageManager.PERMISSION_GRANTED) {' \
            '                status.setText("Shizuku permission granted.");' \
            '                installMasyaanya();' \
            '            } else {' \
            '                status.setText("Shizuku permission denied.");' \
            '                installButton.setEnabled(true);' \
            '            }' \
            '        });' \
            '    };' \
            '' \
            '    @Override' \
            '    protected void onCreate(Bundle state) {' \
            '        super.onCreate(state);' \
            '        setContentView(R.layout.activity_main);' \
            '' \
            '        status = findViewById(R.id.status);' \
            '        installButton = findViewById(R.id.installButton);' \
            '' \
            '        Shizuku.addRequestPermissionResultListener(listener);' \
            '' \
            '        installButton.setOnClickListener(v -> startInstall());' \
            '        updateStatus();' \
            '    }' \
            '' \
            '    @Override' \
            '    protected void onDestroy() {' \
            '        Shizuku.removeRequestPermissionResultListener(listener);' \
            '        super.onDestroy();' \
            '    }' \
            '' \
            '    private void updateStatus() {' \
            '        if (!Shizuku.pingBinder()) {' \
            '            status.setText("Shizuku is not running.");' \
            '            installButton.setEnabled(false);' \
            '            return;' \
            '        }' \
            '' \
            '        if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {' \
            '            status.setText("Press Install to grant Shizuku permission.");' \
            '            installButton.setEnabled(true);' \
            '            return;' \
            '        }' \
            '' \
            '        status.setText("Shizuku ready.");' \
            '        installButton.setEnabled(true);' \
            '    }' \
            '' \
            '    private void startInstall() {' \
            '        if (!Shizuku.pingBinder()) {' \
            '            status.setText("Start Shizuku first.");' \
            '            return;' \
            '        }' \
            '' \
            '        if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {' \
            '            status.setText("Requesting Shizuku permission...");' \
            '            Shizuku.requestPermission(REQUEST_CODE);' \
            '            return;' \
            '        }' \
            '' \
            '        installMasyaanya();' \
            '    }' \
            '' \
            '    private void installMasyaanya() {' \
            '        installButton.setEnabled(false);' \
            '        status.setText("Installing Masyaanya...");' \
            '' \
            '        new Thread(() -> {' \
            '            File apk = null;' \
            '' \
            '            try {' \
            '                apk = new File(getCacheDir(), "Masyaanya.apk");' \
            '                copyAsset("Masyaanya.apk", apk);' \
            '' \
            '                String remote = "/data/local/tmp/Masyaanya.apk";' \
            '' \
            '                Process copy = Shizuku.newProcess(' \
            '                    new String[]{"sh", "-c", "cat > " + remote}, null, null);' \
            '' \
            '                try (InputStream in = new FileInputStream(apk);' \
            '                     OutputStream out = copy.getOutputStream()) {' \
            '                    byte[] buffer = new byte[8192];' \
            '                    int n;' \
            '                    while ((n = in.read(buffer)) != -1) {' \
            '                        out.write(buffer, 0, n);' \
            '                    }' \
            '                    out.flush();' \
            '                }' \
            '' \
            '                int copyResult = copy.waitFor();' \
            '                if (copyResult != 0) throw new Exception("APK copy failed: " + copyResult);' \
            '' \
            '                Process install = Shizuku.newProcess(' \
            '                    new String[]{"sh", "-c", "pm install -r --user 0 " + remote}, null, null);' \
            '' \
            '                String output = readOutput(install);' \
            '                int result = install.waitFor();' \
            '' \
            '                Process cleanup = Shizuku.newProcess(' \
            '                    new String[]{"sh", "-c", "rm -f " + remote}, null, null);' \
            '                cleanup.waitFor();' \
            '' \
            '                if (result != 0) throw new Exception("pm install failed:\\n" + output);' \
            '' \
            '                String finalOutput = output;' \
            '                runOnUiThread(() -> {' \
            '                    status.setText("Masyaanya installed!\\n\\n" + finalOutput);' \
            '                    installButton.setEnabled(true);' \
            '                });' \
            '' \
            '            } catch (Exception e) {' \
            '                String error = e.getClass().getSimpleName() + "\\n\\n" + e.getMessage();' \
            '                runOnUiThread(() -> {' \
            '                    status.setText("Installation failed:\\n\\n" + error);' \
            '                    installButton.setEnabled(true);' \
            '                });' \
            '            } finally {' \
            '                if (apk != null) apk.delete();' \
            '            }' \
            '        }).start();' \
            '    }' \
            '' \
            '    private void copyAsset(String name, File destination) throws Exception {' \
            '        try (InputStream in = getAssets().open(name);' \
            '             OutputStream out = new FileOutputStream(destination)) {' \
            '            byte[] buffer = new byte[8192];' \
            '            int n;' \
            '            while ((n = in.read(buffer)) != -1) {' \
            '                out.write(buffer, 0, n);' \
            '            }' \
            '        }' \
            '    }' \
            '' \
            '    private String readOutput(Process process) throws Exception {' \
            '        BufferedReader reader = new BufferedReader(' \
            '            new InputStreamReader(process.getInputStream()));' \
            '        StringBuilder result = new StringBuilder();' \
            '        String line;' \
            '        while ((line = reader.readLine()) != null) {' \
            '            if (result.length() > 0) result.append("\\n");' \
            '            result.append(line);' \
            '        }' \
            '        return result.toString();' \
            '    }' \
            '}' \
            > installer/app/src/main/java/com/nurasql77/masyaanya/MainActivity.java

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          curl -L \
            -o "$RUNNER_TEMP/gradle.zip" \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q \
            "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd installer

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

      - name: Find keystore alias
        shell: bash
        run: |
          set -e

          ALIAS="$(
            keytool \
              -list \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" |
            sed -n 's/^Alias name: //p' |
            head -n 1
          )"

          test -n "$ALIAS"

          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Zipalign
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/34.0.0/zipalign" \
            -p \
            -f \
            4 \
            installer/app/build/outputs/apk/release/app-release-unsigned.apk \
            installer-aligned.apk

      - name: Sign APK
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Masyaanya-Installer.apk \
            installer-aligned.apk

      - name: Verify APK
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            Masyaanya-Installer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masyaanya-Installer
          path: Masyaanya-Installer.apk
          if-no-files-found: error