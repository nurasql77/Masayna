name: Build Masyaanya Shizuku Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # CHECK SECRETS
      # --------------------------------------------------

      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is missing!"
            exit 1
          fi

          echo "Signing secrets are present."


      # --------------------------------------------------
      # JAVA
      # --------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # DOWNLOAD MASYAANYA APK
      # --------------------------------------------------

      - name: Install gdown
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown==5.2.0

      - name: Download Masyaanya APK
        shell: bash
        run: |
          set -euo pipefail

          python3 -m gdown \
            "1Q3SwSjayWB-OZENGGdxKnPakxpKJLh52" \
            -O Masyaanya.apk

          if [ ! -s Masyaanya.apk ]; then
            echo "::error::Masyaanya.apk was not downloaded!"
            exit 1
          fi

          unzip -t Masyaanya.apk >/dev/null

          echo "Masyaanya APK:"
          ls -lh Masyaanya.apk


      # --------------------------------------------------
      # RESTORE KEYSTORE
      # --------------------------------------------------

      - name: Restore signing keystore
        shell: bash
        run: |
          set -euo pipefail

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release.p12"

          chmod 600 "$RUNNER_TEMP/release.p12"

          if [ ! -s "$RUNNER_TEMP/release.p12" ]; then
            echo "::error::Keystore was not created!"
            exit 1
          fi

          keytool \
            -list \
            -keystore "$RUNNER_TEMP/release.p12" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Keystore is valid."

          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" \
            >> "$GITHUB_ENV"


      # --------------------------------------------------
      # ANDROID SDK
      # --------------------------------------------------

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null |
            head -n 1
          )"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found!"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;34.0.0"

          echo "Android SDK ready."


      # --------------------------------------------------
      # CREATE INSTALLER PROJECT
      # --------------------------------------------------

      - name: Create installer project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf installer

          mkdir -p \
            installer/app/src/main/java/com/nurasql77/masyaanya \
            installer/app/src/main/res/layout \
            installer/app/src/main/res/values \
            installer/app/src/main/assets

          cp Masyaanya.apk \
            installer/app/src/main/assets/Masyaanya.apk


          # ------------------------------
          # settings.gradle
          # ------------------------------

          cat > installer/settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "MasyaanyaInstaller"

include(":app")
EOF


          # ------------------------------
          # root build.gradle
          # ------------------------------

          cat > installer/build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF


          # ------------------------------
          # gradle.properties
          # ------------------------------

          cat > installer/gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=false
EOF


          # ------------------------------
          # app/build.gradle
          # ------------------------------

          cat > installer/app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nurasql77.masyaanya'

    compileSdk 35

    defaultConfig {
        applicationId 'com.nurasql77.masyaanya.installer'

        // Shizuku requires API 24+
        minSdk 24

        targetSdk 35

        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
EOF


          # ------------------------------
          # AndroidManifest.xml
          # ------------------------------

          cat > installer/app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<manifest
    xmlns:android="http://schemas.android.com/apk/res/android">

    <application
        android:allowBackup="false"
        android:label="Masyaanya Installer"
        android:supportsRtl="true"
        android:theme="@style/AppTheme">

        <activity
            android:name=".MainActivity"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>

        </activity>

        <provider
            android:name="rikka.shizuku.ShizukuProvider"
            android:authorities="${applicationId}.shizuku"
            android:exported="true"
            android:multiprocess="false"
            android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />

    </application>

</manifest>
EOF


          # ------------------------------
          # strings.xml
          # ------------------------------

          cat > installer/app/src/main/res/values/strings.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<resources>
    <string name="app_name">Masyaanya Installer</string>
</resources>
EOF


          # ------------------------------
          # styles.xml
          # ------------------------------

          cat > installer/app/src/main/res/values/styles.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<resources>

    <style
        name="AppTheme"
        parent="@android:style/Theme.Material.Light.NoActionBar">

        <item name="android:fontFamily">sans</item>

    </style>

</resources>
EOF


          # ------------------------------
          # activity_main.xml
          # ------------------------------

          cat > installer/app/src/main/res/layout/activity_main.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<LinearLayout
    xmlns:android="http://schemas.android.com/apk/res/android"

    android:layout_width="match_parent"
    android:layout_height="match_parent"

    android:orientation="vertical"
    android:gravity="center"

    android:padding="24dp">

    <TextView
        android:id="@+id/status"

        android:layout_width="match_parent"
        android:layout_height="wrap_content"

        android:text="Masyaanya Installer"
        android:textSize="20sp"

        android:gravity="center"
        android:padding="16dp" />

    <Button
        android:id="@+id/installButton"

        android:layout_width="match_parent"
        android:layout_height="wrap_content"

        android:text="Install Masyaanya"

        android:layout_marginTop="20dp" />

</LinearLayout>
EOF


          # ------------------------------
          # MainActivity.java
          # ------------------------------

          cat > installer/app/src/main/java/com/nurasql77/masyaanya/MainActivity.java <<'EOF'
package com.nurasql77.masyaanya;

import android.app.Activity;
import android.os.Bundle;
import android.content.pm.PackageManager;
import android.widget.Button;
import android.widget.TextView;

import java.io.BufferedReader;
import java.io.File;
import java.io.FileInputStream;
import java.io.FileOutputStream;
import java.io.InputStream;
import java.io.InputStreamReader;
import java.io.OutputStream;

import rikka.shizuku.Shizuku;
import rikka.shizuku.ShizukuRemoteProcess;

public class MainActivity extends Activity {

    private static final int REQUEST_CODE = 100;

    private TextView status;
    private Button installButton;

    private final Shizuku.OnRequestPermissionResultListener
            permissionListener = (requestCode, grantResult) -> {

        if (requestCode != REQUEST_CODE) {
            return;
        }

        runOnUiThread(() -> {

            if (grantResult ==
                    PackageManager.PERMISSION_GRANTED) {

                status.setText(
                        "Shizuku permission granted."
                );

                installMasyaanya();

            } else {

                status.setText(
                        "Shizuku permission denied."
                );

                installButton.setEnabled(true);
            }
        });
    };


    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        setContentView(R.layout.activity_main);

        status =
                findViewById(R.id.status);

        installButton =
                findViewById(R.id.installButton);

        Shizuku.addRequestPermissionResultListener(
                permissionListener
        );

        installButton.setOnClickListener(
                v -> startInstall()
        );

        updateStatus();
    }


    @Override
    protected void onDestroy() {

        Shizuku.removeRequestPermissionResultListener(
                permissionListener
        );

        super.onDestroy();
    }


    private void updateStatus() {

        if (!Shizuku.pingBinder()) {

            status.setText(
                    "Shizuku is not running."
            );

            installButton.setEnabled(false);

            return;
        }


        if (Shizuku.checkSelfPermission()
                != PackageManager.PERMISSION_GRANTED) {

            status.setText(
                    "Press Install to grant Shizuku permission."
            );

            installButton.setEnabled(true);

            return;
        }


        status.setText(
                "Shizuku ready."
        );

        installButton.setEnabled(true);
    }


    private void startInstall() {

        if (!Shizuku.pingBinder()) {

            status.setText(
                    "Start Shizuku first."
            );

            return;
        }


        if (Shizuku.checkSelfPermission()
                != PackageManager.PERMISSION_GRANTED) {

            status.setText(
                    "Requesting Shizuku permission..."
            );

            Shizuku.requestPermission(
                    REQUEST_CODE
            );

            return;
        }


        installMasyaanya();
    }


    private void installMasyaanya() {

        installButton.setEnabled(false);

        status.setText(
                "Installing Masyaanya..."
        );


        new Thread(() -> {

            File apk = null;

            try {

                apk = new File(
                        getCacheDir(),
                        "Masyaanya.apk"
                );


                // Copy APK from assets
                copyAsset(
                        "Masyaanya.apk",
                        apk
                );


                // Temporary location available to shell
                String remote =
                        "/data/local/tmp/Masyaanya.apk";


                // Upload APK through Shizuku
                String[] copyCommand = {
                        "sh",
                        "-c",
                        "cat > " + remote
                };


                ShizukuRemoteProcess copy =
                        Shizuku.newProcess(
                                copyCommand,
                                null,
                                null
                        );


                try (
                        InputStream in =
                                new FileInputStream(apk);

                        OutputStream out =
                                copy.getOutputStream()
                ) {

                    byte[] buffer =
                            new byte[8192];

                    int n;

                    while ((n = in.read(buffer)) != -1) {
                        out.write(buffer, 0, n);
                    }

                    out.flush();
                }


                int copyResult =
                        copy.waitFor();


                if (copyResult != 0) {

                    throw new Exception(
                            "Copy failed: "
                                    + copyResult
                    );
                }


                // Install using Package Manager
                String[] installCommand = {
                        "sh",
                        "-c",
                        "pm install -r --user 0 "
                                + remote
                };


                ShizukuRemoteProcess process =
                        Shizuku.newProcess(
                                installCommand,
                                null,
                                null
                        );


                String output =
                        readOutput(process);


                int result =
                        process.waitFor();


                if (result != 0) {

                    throw new Exception(
                            "pm install failed:\n"
                                    + output
                    );
                }


                // Cleanup
                String[] cleanupCommand = {
                        "sh",
                        "-c",
                        "rm -f " + remote
                };


                ShizukuRemoteProcess cleanup =
                        Shizuku.newProcess(
                                cleanupCommand,
                                null,
                                null
                        );


                cleanup.waitFor();


                final String finalOutput =
                        output;


                runOnUiThread(() -> {

                    status.setText(
                            "Masyaanya installed!\n\n"
                                    + finalOutput
                    );

                    installButton.setEnabled(true);
                });


            } catch (Exception e) {

                final String error =
                        e.getClass().getSimpleName()
                                + "\n\n"
                                + String.valueOf(
                                        e.getMessage()
                                );


                runOnUiThread(() -> {

                    status.setText(
                            "Installation failed:\n\n"
                                    + error
                    );

                    installButton.setEnabled(true);
                });


            } finally {

                if (apk != null) {
                    //noinspection ResultOfMethodCallIgnored
                    apk.delete();
                }
            }

        }).start();
    }


    private void copyAsset(
            String name,
            File destination
    ) throws Exception {

        try (
                InputStream in =
                        getAssets().open(name);

                OutputStream out =
                        new FileOutputStream(destination)
        ) {

            byte[] buffer =
                    new byte[8192];

            int n;

            while ((n = in.read(buffer)) != -1) {
                out.write(buffer, 0, n);
            }

            out.flush();
        }
    }


    private String readOutput(
            ShizukuRemoteProcess process
    ) throws Exception {

        BufferedReader reader =
                new BufferedReader(
                        new InputStreamReader(
                                process.getInputStream()
                        )
                );


        StringBuilder result =
                new StringBuilder();


        String line;


        while ((line = reader.readLine()) != null) {

            if (result.length() > 0) {
                result.append('\n');
            }

            result.append(line);
        }


        return result.toString();
    }
}
EOF


          echo "Installer project created."


      # --------------------------------------------------
      # GRADLE
      # --------------------------------------------------

      - name: Setup Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          curl -L \
            -o "$HOME/gradle.zip" \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q \
            "$HOME/gradle.zip" \
            -d "$HOME"

          rm -f "$HOME/gradle.zip"

          echo "$HOME/gradle-8.9/bin" \
            >> "$GITHUB_PATH"

          "$HOME/gradle-8.9/bin/gradle" \
            --version


      # --------------------------------------------------
      # BUILD
      # --------------------------------------------------

      - name: Build unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          cd installer

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

          if [ ! -f \
            "app/build/outputs/apk/release/app-release-unsigned.apk"
          ]; then
            echo "::error::Unsigned APK was not created!"
            exit 1
          fi

          ls -lh \
            app/build/outputs/apk/release/app-release-unsigned.apk


      # --------------------------------------------------
      # FIND ALIAS
      # --------------------------------------------------

      - name: Find keystore alias
        shell: bash
        run: |
          set -euo pipefail

          ALIAS=$(
            keytool -list -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" |
            sed -n 's/^Alias name: //p' |
            head -n 1
          )

          if [ -z "$ALIAS" ]; then
            echo "::error::Could not find keystore alias!"
            exit 1
          fi

          echo "KEY_ALIAS=$ALIAS" \
            >> "$GITHUB_ENV"

          echo "Keystore alias found."


      # --------------------------------------------------
      # ZIPALIGN
      # --------------------------------------------------

      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_HOME/build-tools/34.0.0/zipalign"

          if [ ! -x "$ZIPALIGN" ]; then
            echo "::error::zipalign not found!"
            exit 1
          fi

          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            installer/app/build/outputs/apk/release/app-release-unsigned.apk \
            installer-aligned.apk

          ls -lh installer-aligned.apk


      # --------------------------------------------------
      # SIGN
      # --------------------------------------------------

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found!"
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Masyaanya-Installer.apk \
            installer-aligned.apk

          ls -lh Masyaanya-Installer.apk


      # --------------------------------------------------
      # VERIFY SIGNATURE
      # --------------------------------------------------

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            Masyaanya-Installer.apk


      # --------------------------------------------------
      # UPLOAD ARTIFACT
      # --------------------------------------------------

      - name: Upload installer APK
        uses: actions/upload-artifact@v4
        with:
          name: Masyaanya-Installer
          path: Masyaanya-Installer.apk
          if-no-files-found: error