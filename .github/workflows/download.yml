name: Build Masyaanya Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MASYAANYA_FILE_ID: 1Q3SwSjayWB-OZENGGdxKnPakxpKJLh52

    steps:
      # 1. Repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Download the original game APK
      - name: Download Masyaanya APK
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install gdown==5.2.0

          python3 -m gdown \
            "$MASYAANYA_FILE_ID" \
            -O Masyaanya.apk

          test -s Masyaanya.apk
          unzip -t Masyaanya.apk >/dev/null

          echo "Original game APK:"
          ls -lh Masyaanya.apk

      # 4. Android SDK
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=""

          for p in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          do
            if [ -x "$p" ]; then
              SDKMANAGER="$p"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;34.0.0"

      # 5. Gradle
      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle-8.9-bin.zip

          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version

      # 6. Generate the complete Android project
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p \
            app/src/main/java/com/nurasql77/masyainstaller \
            app/src/main/aidl/com/nurasql77/masyainstaller \
            app/src/main/res/values \
            app/src/main/assets

          cp Masyaanya.apk app/src/main/assets/Masyaanya.apk

          # settings.gradle
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MasyaanyaInstaller"
          include(":app")
          EOF

          # Root build.gradle
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          # gradle.properties
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # app/build.gradle
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nurasql77.masyainstaller'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nurasql77.masyainstaller'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildFeatures {
                  aidl true
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'dev.rikka.shizuku:api:13.1.5'
              implementation 'dev.rikka.shizuku:provider:13.1.5'
              implementation 'androidx.annotation:annotation:1.9.1'
          }
          EOF

          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Masyaanya Installer"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />

              </application>
          </manifest>
          EOF

          # Theme
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#3F51B5</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          # AIDL: every method must have a transaction ID
          cat > app/src/main/aidl/com/nurasql77/masyainstaller/IInstallerService.aidl <<'EOF'
          package com.nurasql77.masyainstaller;

          interface IInstallerService {
              void destroy() = 16777114;
              void install(String apkPath) = 1;
          }
          EOF

          # InstallerService.java
          cat > app/src/main/java/com/nurasql77/masyainstaller/InstallerService.java <<'EOF'
          package com.nurasql77.masyainstaller;

          import android.os.RemoteException;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;

          public class InstallerService extends IInstallerService.Stub {

              public InstallerService() {
              }

              @Override
              public void destroy() {
                  System.exit(0);
              }

              @Override
              public void install(String apkPath) throws RemoteException {
                  Process process = null;

                  try {
                      String temp = "/data/local/tmp/Masyaanya.apk";

                      String command =
                              "rm -f " + quote(temp)
                              + " && cp " + quote(apkPath) + " " + quote(temp)
                              + " && chmod 644 " + quote(temp)
                              + " && pm install -r --user 0 " + quote(temp);

                      process = Runtime.getRuntime().exec(
                              new String[]{"sh", "-c", command}
                      );

                      StringBuilder output = new StringBuilder();

                      try (BufferedReader stdout = new BufferedReader(
                              new InputStreamReader(process.getInputStream()));
                           BufferedReader stderr = new BufferedReader(
                              new InputStreamReader(process.getErrorStream()))) {

                          String line;

                          while ((line = stdout.readLine()) != null) {
                              output.append(line).append('\n');
                          }

                          while ((line = stderr.readLine()) != null) {
                              output.append(line).append('\n');
                          }
                      }

                      int exitCode = process.waitFor();

                      if (exitCode != 0) {
                          throw new RemoteException(
                                  "Installation failed. Exit code: "
                                          + exitCode + "\n" + output
                          );
                      }

                      if (output.indexOf("Success") < 0) {
                          throw new RemoteException(
                                  "Installer did not confirm success:\n" + output
                          );
                      }

                  } catch (RemoteException e) {
                      throw e;
                  } catch (Throwable e) {
                      throw new RemoteException(
                              "Installer error: "
                                      + e.getClass().getSimpleName()
                                      + ": " + String.valueOf(e.getMessage())
                      );
                  } finally {
                      if (process != null) {
                          process.destroy();
                      }
                  }
              }

              private static String quote(String value) {
                  return "'" + value.replace("'", "'\\''") + "'";
              }
          }
          EOF

          # MainActivity.java
          cat > app/src/main/java/com/nurasql77/masyainstaller/MainActivity.java <<'EOF'
          package com.nurasql77.masyainstaller;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.ServiceConnection;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;

          import rikka.shizuku.Shizuku;

          public class MainActivity extends Activity {

              private static final int REQUEST_CODE = 1001;

              private TextView status;
              private IInstallerService installerService;
              private Shizuku.UserServiceArgs userServiceArgs;
              private boolean installationStarted = false;

              private final Shizuku.OnRequestPermissionResultListener permissionListener =
                      (requestCode, grantResult) -> {
                          if (requestCode != REQUEST_CODE) {
                              return;
                          }

                          if (grantResult == PackageManager.PERMISSION_GRANTED) {
                              setStatus("Shizuku рұқсаты берілді.");
                              startUserService();
                          } else {
                              setStatus("Shizuku рұқсаты берілмеді.");
                          }
                      };

              private final Shizuku.OnBinderReceivedListener binderReceivedListener =
                      () -> runOnUiThread(this::checkShizuku);

              private final ServiceConnection serviceConnection =
                      new ServiceConnection() {
                          @Override
                          public void onServiceConnected(
                                  ComponentName name, IBinder binder) {
                              installerService =
                                      IInstallerService.Stub.asInterface(binder);

                              runOnUiThread(() -> {
                                  setStatus("UserService дайын.");

                                  if (installationStarted) {
                                      installationStarted = false;
                                      installMasyaanya();
                                  }
                              });
                          }

                          @Override
                          public void onServiceDisconnected(ComponentName name) {
                              installerService = null;
                              runOnUiThread(() ->
                                      setStatus("UserService ажыратылды."));
                          }
                      };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(40, 40, 40, 40);

                  status = new TextView(this);
                  status.setTextSize(18);
                  status.setText("Masyaanya Installer");

                  Button install = new Button(this);
                  install.setText("Masyaanya орнату");
                  install.setOnClickListener(v -> startInstall());

                  layout.addView(status);
                  layout.addView(install);
                  setContentView(layout);

                  Shizuku.addRequestPermissionResultListener(permissionListener);
                  Shizuku.addBinderReceivedListener(binderReceivedListener);

                  checkShizuku();
              }

              private void checkShizuku() {
                  try {
                      if (!Shizuku.pingBinder()) {
                          setStatus("Shizuku іске қосылмаған.");
                          return;
                      }

                      if (Shizuku.checkSelfPermission()
                              == PackageManager.PERMISSION_GRANTED) {
                          setStatus("Shizuku дайын. Орнату батырмасын бас.");
                      } else {
                          setStatus("Орнату үшін Shizuku рұқсаты қажет.");
                      }
                  } catch (Throwable e) {
                      setStatus("Shizuku қатесі: " + e.getMessage());
                  }
              }

              private void startInstall() {
                  try {
                      if (!Shizuku.pingBinder()) {
                          setStatus("Алдымен Shizuku-ды іске қос.");
                          return;
                      }

                      if (Shizuku.checkSelfPermission()
                              != PackageManager.PERMISSION_GRANTED) {
                          setStatus("Shizuku рұқсаты сұралуда...");
                          Shizuku.requestPermission(REQUEST_CODE);
                          return;
                      }

                      if (installerService == null) {
                          installationStarted = true;
                          startUserService();
                      } else {
                          installMasyaanya();
                      }
                  } catch (Throwable e) {
                      setStatus("Қате: " + e.getMessage());
                  }
              }

              private void startUserService() {
                  try {
                      if (installerService != null) {
                          if (installationStarted) {
                              installationStarted = false;
                              installMasyaanya();
                          }
                          return;
                      }

                      userServiceArgs = new Shizuku.UserServiceArgs(
                              new ComponentName(this, InstallerService.class)
                      )
                              .daemon(false)
                              .processNameSuffix("installer")
                              .debuggable(false)
                              .version(1)
                              .tag("masyaanya-installer");

                      setStatus("Shizuku UserService іске қосылуда...");

                      Shizuku.bindUserService(userServiceArgs, serviceConnection);

                  } catch (Throwable e) {
                      installationStarted = false;
                      setStatus("UserService қатесі: " + e.getMessage());
                  }
              }

              private void installMasyaanya() {
                  if (installerService == null) {
                      setStatus("InstallerService дайын емес. Қайта басып көр.");
                      return;
                  }

                  new Thread(() -> {
                      try {
                          runOnUiThread(() ->
                                  setStatus("Masyaanya.apk шығарылуда..."));

                          File externalDir = getExternalFilesDir(null);

                          if (externalDir == null) {
                              throw new Exception(
                                      "External files directory қолжетімсіз.");
                          }

                          File apk = new File(externalDir, "Masyaanya.apk");

                          try (InputStream input = getAssets().open("Masyaanya.apk");
                               FileOutputStream output = new FileOutputStream(apk)) {

                              byte[] buffer = new byte[64 * 1024];
                              int count;

                              while ((count = input.read(buffer)) != -1) {
                                  output.write(buffer, 0, count);
                              }

                              output.flush();
                          }

                          if (!apk.isFile() || apk.length() == 0) {
                              throw new Exception("Masyaanya.apk бос немесе жоқ.");
                          }

                          runOnUiThread(() ->
                                  setStatus("APK дайын. Shizuku арқылы орнатылуда..."));

                          installerService.install(apk.getAbsolutePath());

                          runOnUiThread(() ->
                                  setStatus("Masyaanya орнатылды."));

                      } catch (Throwable e) {
                          String message = e.getMessage();

                          runOnUiThread(() ->
                                  setStatus("Орнату қатесі:\n"
                                          + (message == null
                                          ? e.getClass().getSimpleName()
                                          : message)));
                      }
                  }).start();
              }

              private void setStatus(String text) {
                  runOnUiThread(() -> {
                      if (status != null) {
                          status.setText(text);
                      }
                  });
              }

              @Override
              protected void onDestroy() {
                  try {
                      if (userServiceArgs != null) {
                          Shizuku.unbindUserService(
                                  userServiceArgs, serviceConnection, true);
                      }
                  } catch (Throwable ignored) {
                  }

                  Shizuku.removeRequestPermissionResultListener(permissionListener);
                  Shizuku.removeBinderReceivedListener(binderReceivedListener);

                  super.onDestroy();
              }
          }
          EOF

          echo "Project files generated."
          find app/src/main -type f -print

      # 7. Build and locate the generated APK
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace :app:assembleRelease

          echo "Gradle finished. Searching for APK files..."

          find app/build/outputs -type f -name '*.apk' -print

          mapfile -t APK_FILES < <(
            find app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              -print | sort
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            find app/build/outputs -maxdepth 6 -type f -print || true
            exit 1
          fi

          # Prefer the release APK, whether signed or unsigned.
          APK=""

          for candidate in "${APK_FILES[@]}"; do
            if [[ "$candidate" == *"/release/"* ]]; then
              APK="$candidate"
              break
            fi
          done

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo "Selected APK: $APK"
          ls -lh "$APK"

          cp "$APK" app-release-unsigned.apk

          test -s app-release-unsigned.apk

          echo "Installer APK ready for signing:"
          ls -lh app-release-unsigned.apk

      # 8. Restore the signing keystore
      - name: Restore PKCS12 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is empty."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.p12

          test -s release.p12

          keytool \
            -list \
            -keystore release.p12 \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

          echo "PKCS12 keystore verified."

      # 9. Align, sign and verify the Installer APK
      - name: Zipalign and sign
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          INPUT_APK="app-release-unsigned.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          test -s "$INPUT_APK"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          # Extract alias without piping keytool directly into head.
          keytool \
            -list \
            -v \
            -keystore release.p12 \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            > keystore-info.txt

          ALIAS=$(sed -n 's/^Alias name: //p' keystore-info.txt | sed -n '1p')

          if [ -z "$ALIAS" ]; then
            echo "ERROR: Could not detect the keystore alias."
            exit 1
          fi

          echo "Keystore alias detected."

          "$BUILD_TOOLS/zipalign" \
            -f 4 \
            "$INPUT_APK" \
            Masyaanya-Installer-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out Masyaanya-Installer.apk \
            Masyaanya-Installer-aligned.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            Masyaanya-Installer.apk

          test -s Masyaanya-Installer.apk

          echo "Final signed Installer APK:"
          ls -lh Masyaanya-Installer.apk

      # 10. Upload final APK as an artifact
      - name: Upload installer APK
        uses: actions/upload-artifact@v4
        with:
          name: Masyaanya-Installer
          path: Masyaanya-Installer.apk
          if-no-files-found: error