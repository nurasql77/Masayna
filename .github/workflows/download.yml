name: Build Masyaanya Installer

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

env:
  DRIVE_FILE_ID: 1Q3SwSjayWB-OZENGGdxKnPakxpKJLh52

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Download Masyaanya APK
    run: |
      python3 -m pip install --upgrade pip
      python3 -m pip install gdown==5.2.0

      python3 -m gdown \
        "$DRIVE_FILE_ID" \
        -O Masyaanya.apk

      test -s Masyaanya.apk
      unzip -t Masyaanya.apk >/dev/null

      echo "Masyaanya APK OK"

  - name: Setup Android SDK
    run: |
      SDKMANAGER=""

      for p in \
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
        "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
        "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
        "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
      do
        if [ -x "$p" ]; then
          SDKMANAGER="$p"
          break
        fi
      done

      if [ -z "$SDKMANAGER" ]; then
        echo "sdkmanager not found"
        exit 1
      fi

      yes | "$SDKMANAGER" --licenses >/dev/null || true

      "$SDKMANAGER" \
        "platforms;android-35" \
        "build-tools;34.0.0"

  - name: Setup Gradle
    run: |
      wget -q \
        https://services.gradle.org/distributions/gradle-8.9-bin.zip \
        -O gradle.zip

      unzip -q gradle.zip -d "$RUNNER_TEMP/gradle"

      echo "$RUNNER_TEMP/gradle/gradle-8.9/bin" \
        >> "$GITHUB_PATH"

  - name: Generate complete Android project
    run: |

      mkdir -p \
        app/src/main/java/com/nurasql77/masyaanya \
        app/src/main/aidl/com/nurasql77/masyaanya \
        app/src/main/res/values \
        app/src/main/assets

      cp Masyaanya.apk \
        app/src/main/assets/Masyaanya.apk

      # -------------------------
      # settings.gradle
      # -------------------------

      printf '%s\n' \
      'pluginManagement {' \
      '    repositories {' \
      '        google()' \
      '        mavenCentral()' \
      '        gradlePluginPortal()' \
      '    }' \
      '}' \
      '' \
      'dependencyResolutionManagement {' \
      '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
      '    repositories {' \
      '        google()' \
      '        mavenCentral()' \
      '    }' \
      '}' \
      '' \
      'rootProject.name = "MasyaanyaInstaller"' \
      'include(":app")' \
      > settings.gradle

      # -------------------------
      # root build.gradle
      # -------------------------

      printf '%s\n' \
      'plugins {' \
      '    id "com.android.application" version "8.7.3" apply false' \
      '}' \
      > build.gradle

      # -------------------------
      # gradle.properties
      # -------------------------

      printf '%s\n' \
      'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
      'android.useAndroidX=true' \
      > gradle.properties

      # -------------------------
      # app/build.gradle
      # -------------------------

      printf '%s\n' \
      'plugins {' \
      '    id "com.android.application"' \
      '}' \
      '' \
      'android {' \
      '    namespace "com.nurasql77.masyaanya"' \
      '    compileSdk 35' \
      '' \
      '    defaultConfig {' \
      '        applicationId "com.nurasql77.masyaanya.installer"' \
      '        minSdk 24' \
      '        targetSdk 35' \
      '        versionCode 1' \
      '        versionName "1.0"' \
      '    }' \
      '' \
      '    buildTypes {' \
      '        release {' \
      '            minifyEnabled false' \
      '            shrinkResources false' \
      '        }' \
      '    }' \
      '}' \
      '' \
      'dependencies {' \
      '    implementation "dev.rikka.shizuku:api:13.1.5"' \
      '    implementation "dev.rikka.shizuku:provider:13.1.5"' \
      '}' \
      > app/build.gradle

      # -------------------------
      # AIDL
      # -------------------------

      printf '%s\n' \
      'package com.nurasql77.masyaanya;' \
      '' \
      'interface IInstallerService {' \
      '    void install(String apkPath);' \
      '    void destroy() = 16777114;' \
      '}' \
      > app/src/main/aidl/com/nurasql77/masyaanya/IInstallerService.aidl

      # -------------------------
      # UserService
      # -------------------------

      printf '%s\n' \
      'package com.nurasql77.masyaanya;' \
      '' \
      'import android.os.RemoteException;' \
      'import java.io.BufferedReader;' \
      'import java.io.InputStreamReader;' \
      '' \
      'public class InstallerService extends IInstallerService.Stub {' \
      '' \
      '    public InstallerService() {' \
      '    }' \
      '' \
      '    @Override' \
      '    public void install(String apkPath) throws RemoteException {' \
      '        try {' \
      '            Process process = Runtime.getRuntime().exec(' \
      '                new String[]{' \
      '                    "sh", "-c",' \
      '                    "pm install -r --user 0 \\"" +' \
      '                    apkPath.replace("\\"", "\\\\\\"" ) +' \
      '                    "\\"" ' \
      '                }' \
      '            );' \
      '' \
      '            BufferedReader out = new BufferedReader(' \
      '                new InputStreamReader(process.getInputStream())' \
      '            );' \
      '' \
      '            BufferedReader err = new BufferedReader(' \
      '                new InputStreamReader(process.getErrorStream())' \
      '            );' \
      '' \
      '            StringBuilder result = new StringBuilder();' \
      '            String line;' \
      '' \
      '            while ((line = out.readLine()) != null) {' \
      '                result.append(line).append("\n");' \
      '            }' \
      '' \
      '            while ((line = err.readLine()) != null) {' \
      '                result.append(line).append("\n");' \
      '            }' \
      '' \
      '            int code = process.waitFor();' \
      '' \
      '            if (code != 0) {' \
      '                throw new RuntimeException(' \
      '                    "pm install failed: " + result' \
      '                );' \
      '            }' \
      '' \
      '        } catch (Exception e) {' \
      '            throw new RemoteException(' \
      '                "Install failed: " + e.getMessage()' \
      '            );' \
      '        }' \
      '    }' \
      '' \
      '    @Override' \
      '    public void destroy() {' \
      '        System.exit(0);' \
      '    }' \
      '}' \
      > app/src/main/java/com/nurasql77/masyaanya/InstallerService.java

      # -------------------------
      # MainActivity
      # -------------------------

      printf '%s\n' \
      'package com.nurasql77.masyaanya;' \
      '' \
      'import android.app.Activity;' \
      'import android.os.Bundle;' \
      'import android.os.IBinder;' \
      'import android.content.ComponentName;' \
      'import android.content.ServiceConnection;' \
      'import android.content.pm.PackageManager;' \
      'import android.widget.Toast;' \
      '' \
      'import java.io.File;' \
      'import java.io.FileOutputStream;' \
      'import java.io.InputStream;' \
      '' \
      'import rikka.shizuku.Shizuku;' \
      '' \
      'public class MainActivity extends Activity {' \
      '' \
      '    private IInstallerService installer;' \
      '' \
      '    private final ServiceConnection connection =' \
      '        new ServiceConnection() {' \
      '' \
      '        @Override' \
      '        public void onServiceConnected(' \
      '                ComponentName name, IBinder service) {' \
      '            installer =' \
      '                IInstallerService.Stub.asInterface(service);' \
      '            installApk();' \
      '        }' \
      '' \
      '        @Override' \
      '        public void onServiceDisconnected(ComponentName name) {' \
      '            installer = null;' \
      '        }' \
      '    };' \
      '' \
      '    private final Shizuku.OnRequestPermissionResultListener' \
      '        permissionListener = (requestCode, grantResult) -> {' \
      '' \
      '        if (requestCode != 100) return;' \
      '' \
      '        if (grantResult == PackageManager.PERMISSION_GRANTED) {' \
      '            bindInstaller();' \
      '        } else {' \
      '            toast("Shizuku рұқсаты берілмеді");' \
      '        }' \
      '    };' \
      '' \
      '    @Override' \
      '    protected void onCreate(Bundle state) {' \
      '        super.onCreate(state);' \
      '' \
      '        Shizuku.addRequestPermissionResultListener(' \
      '            permissionListener' \
      '        );' \
      '' \
      '        if (!Shizuku.pingBinder()) {' \
      '            toast("Shizuku іске қосылмаған");' \
      '            return;' \
      '        }' \
      '' \
      '        if (Shizuku.checkSelfPermission() !=' \
      '            PackageManager.PERMISSION_GRANTED) {' \
      '            Shizuku.requestPermission(100);' \
      '        } else {' \
      '            bindInstaller();' \
      '        }' \
      '    }' \
      '' \
      '    private void bindInstaller() {' \
      '        try {' \
      '            Shizuku.UserServiceArgs args =' \
      '                new Shizuku.UserServiceArgs(' \
      '                    new ComponentName(' \
      '                        this, InstallerService.class' \
      '                    )' \
      '                )' \
      '                .daemon(false)' \
      '                .processNameSuffix("installer")' \
      '                .version(1)' \
      '                .tag("masyaanya-installer");' \
      '' \
      '            Shizuku.bindUserService(args, connection);' \
      '' \
      '        } catch (Exception e) {' \
      '            toast("UserService қатесі: " + e.getMessage());' \
      '        }' \
      '    }' \
      '' \
      '    private void installApk() {' \
      '        new Thread(() -> {' \
      '' \
      '            File apk = null;' \
      '' \
      '            try {' \
      '                apk = new File(' \
      '                    getCacheDir(), "Masyaanya.apk"' \
      '                );' \
      '' \
      '                try (' \
      '                    InputStream input =' \
      '                        getAssets().open("Masyaanya.apk");' \
      '                    FileOutputStream output =' \
      '                        new FileOutputStream(apk)' \
      '                ) {' \
      '' \
      '                    byte[] buffer = new byte[8192];' \
      '                    int count;' \
      '' \
      '                    while ((count = input.read(buffer)) != -1) {' \
      '                        output.write(buffer, 0, count);' \
      '                    }' \
      '                }' \
      '' \
      '                installer.install(apk.getAbsolutePath());' \
      '' \
      '                runOnUiThread(() ->' \
      '                    toast("Masyaanya орнатылды!")' \
      '                );' \
      '' \
      '            } catch (Exception e) {' \
      '                String message = e.getMessage();' \
      '                runOnUiThread(() ->' \
      '                    toast("Орнату қатесі: " + message)' \
      '                );' \
      '            } finally {' \
      '                if (apk != null) apk.delete();' \
      '            }' \
      '        }).start();' \
      '    }' \
      '' \
      '    private void toast(String text) {' \
      '        Toast.makeText(' \
      '            this, text, Toast.LENGTH_LONG' \
      '        ).show();' \
      '    }' \
      '' \
      '    @Override' \
      '    protected void onDestroy() {' \
      '        try {' \
      '            Shizuku.UserServiceArgs args =' \
      '                new Shizuku.UserServiceArgs(' \
      '                    new ComponentName(' \
      '                        this, InstallerService.class' \
      '                    )' \
      '                )' \
      '                .daemon(false)' \
      '                .processNameSuffix("installer")' \
      '                .version(1)' \
      '                .tag("masyaanya-installer");' \
      '' \
      '            Shizuku.unbindUserService(' \
      '                args, connection, true' \
      '            );' \
      '        } catch (Exception ignored) {' \
      '        }' \
      '' \
      '        Shizuku.removeRequestPermissionResultListener(' \
      '            permissionListener' \
      '        );' \
      '' \
      '        super.onDestroy();' \
      '    }' \
      '}' \
      > app/src/main/java/com/nurasql77/masyaanya/MainActivity.java

      # -------------------------
      # Manifest
      # -------------------------

      printf '%s\n' \
      '<?xml version="1.0" encoding="utf-8"?>' \
      '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
      '' \
      '    <application' \
      '        android:theme="@style/AppTheme"' \
      '        android:label="Masyaanya Installer"' \
      '        android:allowBackup="false"' \
      '        android:supportsRtl="true">' \
      '' \
      '        <activity' \
      '            android:name=".MainActivity"' \
      '            android:exported="true">' \
      '' \
      '            <intent-filter>' \
      '                <action android:name="android.intent.action.MAIN" />' \
      '                <category android:name="android.intent.category.LAUNCHER" />' \
      '            </intent-filter>' \
      '' \
      '        </activity>' \
      '' \
      '    </application>' \
      '</manifest>' \
      > app/src/main/AndroidManifest.xml

      # -------------------------
      # Theme
      # -------------------------

      printf '%s\n' \
      '<?xml version="1.0" encoding="utf-8"?>' \
      '<resources>' \
      '    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">' \
      '        <item name="android:fontFamily">sans</item>' \
      '        <item name="android:colorAccent">#3F51B5</item>' \
      '    </style>' \
      '</resources>' \
      > app/src/main/res/values/styles.xml

  - name: Build APK
    run: |
      gradle :app:assembleRelease --no-daemon

  - name: Restore PKCS12 keystore
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    run: |
      test -n "$KEYSTORE_BASE64"
      test -n "$KEYSTORE_PASSWORD"

      printf '%s' "$KEYSTORE_BASE64" |
        base64 --decode > release.p12

      test -s release.p12

  - name: Sign APK
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    run: |
      BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

      mkdir -p signed

      "$BUILD_TOOLS/zipalign" \
        -f 4 \
        app/build/outputs/apk/release/app-release.apk \
        signed/aligned.apk

      ALIAS=$(
        keytool -list -v \
          -keystore release.p12 \
          -storetype PKCS12 \
          -storepass "$KEYSTORE_PASSWORD" |
        sed -n 's/^Alias name: //p' |
        head -n 1
      )

      test -n "$ALIAS"

      "$BUILD_TOOLS/apksigner" sign \
        --ks release.p12 \
        --ks-type PKCS12 \
        --ks-pass env:KEYSTORE_PASSWORD \
        --key-pass env:KEYSTORE_PASSWORD \
        --ks-key-alias "$ALIAS" \
        --out signed/Masyaanya-Installer.apk \
        signed/aligned.apk

      "$BUILD_TOOLS/apksigner" verify \
        --verbose \
        signed/Masyaanya-Installer.apk

      rm -f signed/aligned.apk release.p12

  - name: Upload final APK
    uses: actions/upload-artifact@v4
    with:
      name: Masyaanya-Installer
      path: signed/Masyaanya-Installer.apk
      if-no-files-found: error
      retention-days: 30