name: Download and Sign Masyaanya APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/download.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Download APK from Google Drive
      # ============================================================
      - name: Download APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Installing gdown ==="

          python3 -m pip install \
            --quiet \
            --disable-pip-version-check \
            "gdown==5.2.0"

          rm -f Masyaanya.apk

          echo "=== Downloading APK ==="

          SUCCESS=0

          for i in 1 2 3; do
            echo "Download attempt: $i/3"

            if python3 -m gdown \
              "1Q3SwSjayWB-OZENGGdxKnPakxpKJLh52" \
              -O Masyaanya.apk; then

              if [ -s Masyaanya.apk ]; then
                SUCCESS=1
                break
              fi
            fi

            rm -f Masyaanya.apk

            if [ "$i" -lt 3 ]; then
              echo "Waiting 10 seconds..."
              sleep 10
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "::error::Google Drive APK download failed."
            echo "::error::The Google Drive file must be accessible without login."
            exit 1
          fi

          echo "=== Download successful ==="

          ls -lh Masyaanya.apk
          file Masyaanya.apk

          echo "=== Checking APK ==="

          if ! unzip -t Masyaanya.apk >/dev/null 2>&1; then
            echo "::error::Downloaded file is not a valid APK/ZIP!"
            echo ""
            echo "First bytes:"
            xxd -l 32 Masyaanya.apk || true
            exit 1
          fi

          echo "APK is valid."

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. Android SDK
      #
      # Do NOT use:
      # android-actions/setup-android@v3
      #
      # GitHub ubuntu-latest already contains Android SDK.
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          else
            SDKMANAGER=$(
              find "$ANDROID_HOME/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -perm -111 \
                2>/dev/null |
              sort -V |
              tail -n 1 || true
            )
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found!"

            find "$ANDROID_HOME" \
              -maxdepth 5 \
              -type f \
              -name sdkmanager \
              2>/dev/null || true

            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo "=== Accepting Android SDK licenses ==="

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "=== Installing build-tools 34.0.0 ==="

          "$SDKMANAGER" "build-tools;34.0.0"

          echo "=== Checking build-tools ==="

          if [ ! -x "$ANDROID_HOME/build-tools/34.0.0/apksigner" ]; then
            echo "::error::apksigner not found!"
            exit 1
          fi

          if [ ! -x "$ANDROID_HOME/build-tools/34.0.0/zipalign" ]; then
            echo "::error::zipalign not found!"
            exit 1
          fi

          echo "Android Build Tools ready."

      # ============================================================
      # 4. Sign APK
      # ============================================================
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=== Checking secrets ==="

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is missing!"
            exit 1
          fi

          echo "Secrets found."

          # ========================================================
          # Restore P12
          # ========================================================

          echo "$KEYSTORE_BASE64" | base64 --decode > release.p12

          if [ ! -s release.p12 ]; then
            echo "::error::release.p12 is empty!"
            exit 1
          fi

          echo "P12 restored successfully."

          # ========================================================
          # Check P12 password
          # ========================================================

          if ! keytool -list \
            -keystore release.p12 \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null 2>&1; then

            echo "::error::KEYSTORE_PASSWORD is incorrect or P12 is corrupted!"
            exit 1
          fi

          echo "P12 password is correct."

          # ========================================================
          # Find alias
          # ========================================================

          ALIAS=$(
            keytool -list -v \
              -keystore release.p12 \
              -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" |
            sed -n 's/^Alias name: //p' |
            head -n 1
          )

          if [ -z "$ALIAS" ]; then
            echo "::error::Could not find alias in P12!"
            exit 1
          fi

          echo "Alias found."

          # ========================================================
          # Build Tools
          # ========================================================

          BT_DIR="$ANDROID_HOME/build-tools/34.0.0"

          APKSIGNER="$BT_DIR/apksigner"
          ZIPALIGN="$BT_DIR/zipalign"

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found!"
            exit 1
          fi

          if [ ! -x "$ZIPALIGN" ]; then
            echo "::error::zipalign not found!"
            exit 1
          fi

          # ========================================================
          # Zipalign
          # ========================================================

          echo "=== Running zipalign ==="

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            Masyaanya.apk \
            Masyaanya-aligned.apk

          if [ ! -s Masyaanya-aligned.apk ]; then
            echo "::error::zipalign failed!"
            exit 1
          fi

          echo "Zipalign OK."

          # ========================================================
          # Sign APK
          # ========================================================

          echo "=== Signing APK ==="

          "$APKSIGNER" sign \
            --ks release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Masyaanya-signed.apk \
            Masyaanya-aligned.apk

          if [ ! -s Masyaanya-signed.apk ]; then
            echo "::error::Signed APK was not created!"
            exit 1
          fi

          echo "Signing completed."

          # ========================================================
          # Verify signature
          # ========================================================

          echo "=== Verifying APK ==="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            Masyaanya-signed.apk

          echo ""
          echo "======================================"
          echo " APK SIGNED SUCCESSFULLY"
          echo "======================================"

          ls -lh Masyaanya-signed.apk

          # ========================================================
          # Remove temporary files
          # ========================================================

          rm -f release.p12
          rm -f Masyaanya-aligned.apk

      # ============================================================
      # 5. Upload signed APK
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Masyaanya-signed
          path: Masyaanya-signed.apk
          if-no-files-found: error
          retention-days: 30